[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-code-review"
version = "0.1.0"
description = "Agent-based code review assistant built with Python, automating intelligent code analysis and review tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pathspec>=0.12",
    "rich>=13.7",
    "langchain>=0.2",
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "langchain-google-genai>=1.0",
    "langchain-deepseek>=0.1",
    "mcp>=1.27.1",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-php>=0.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
agent-code-review = "agent_code_review.cli.app:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_code_review"]

[tool.ruff]
line-length = 100
target-version = "py310"
